name: Release
on:
  push:
    tags: ["v*"]
jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/stable-macos-arm64-AgentEval.dmg
            artifacts/stable-macos-arm64-AgentEval.app.tar.zst
            artifacts/stable-macos-arm64-update.json
